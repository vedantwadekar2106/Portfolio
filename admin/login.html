<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Portfolio Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- Background -->
    <div class="bg-blur bg-one"></div>
    <div class="bg-blur bg-two"></div>

    <main class="login-page">

        <section class="login-card" aria-labelledby="loginHeading">

            <!-- Logo -->
            <div class="logo-area">

                <div class="logo-circle">
                    <span>PA</span>
                </div>

                <h1 id="loginHeading">
                    Portfolio Admin
                </h1>

                <p>
                    Secure Dashboard Access
                </p>

            </div>

            <!-- Welcome -->
            <div class="welcome-area">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to manage your portfolio, messages and dashboard.
                </p>

            </div>

            <!-- Messages -->
            <div
                id="messageBox"
                class="message-box"
                role="alert"
                aria-live="polite">
            </div>

            <!-- Login Form -->
            <form
                id="loginForm"
                class="login-form"
                novalidate>

                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required>

                    <small
                        class="error-text"
                        id="emailError">
                    </small>

                </div>

                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show Password">

                            👁

                        </button>

                    </div>

                    <small
                        class="error-text"
                        id="passwordError">
                    </small>

                </div>

                <!-- Options -->
                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember Me
                        </span>

                    </label>

                    <a
                        href="#"
                        class="forgot-link">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->
                <button
                    id="loginBtn"
                    type="submit"
                    class="login-btn">

                    <span id="btnText">
                        Login
                    </span>

                    <span
                        id="spinner"
                        class="spinner hidden"
                        aria-hidden="true">
                    </span>

                </button>

            </form>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="js/login.js"></script>

</body>

</html>
